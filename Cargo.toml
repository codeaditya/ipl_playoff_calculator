[package]
name = "ipl_playoff_calculator"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/codeaditya/ipl_playoff_calculator"
description = "A high-performance CLI tool that computes each IPL team's probability of finishing in the Top 2 and Top 4 positions"
license = "MIT"
keywords = ["ipl", "sports", "calculator", "simulation", "probability"]
categories = ["command-line-utilities"]
default-run = "ipl_playoff_calculator"

[dependencies]
sysinfo = "0.39"
terminal_size = "0.4"

[[bin]]
name = "ipl_playoff_calculator"
path = "src/main.rs"

[[bin]]
name = "dump_golden"
path = "src/bin/dump_golden.rs"
