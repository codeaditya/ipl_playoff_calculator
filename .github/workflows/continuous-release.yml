name: Continuous Release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  actions: write    # needed to delete stale caches
  contents: write   # needed to force-push 'continuous' tag and edit the release

env:
  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  SHORT_SHA: ${{ github.sha }}
  CARGO_VOLUME_NAME: cargo-cache
  LINUX_BUILDER_IMAGE: rust_linux_builder
  WINDOWS_CARGO_CACHE_KEY_PREFIX: windows:cargo-cache
  LINUX_CARGO_CACHE_KEY_PREFIX: linux:cargo-cache
  LINUX_BUILDER_IMAGE_CACHE_KEY_PREFIX: image:rust_linux_builder

jobs:
  # ===========================================================================
  # Job 1 · prepare
  # ===========================================================================
  prepare:
    name: Prepare
    runs-on: ubuntu-latest

    steps:
      - name: Delete stale caches (older than 7 days)
        run: |
          SEVEN_DAYS_AGO=$(date -d '7 days ago' --utc +%s)

          for KEY_PREFIX in \
              "${{ env.WINDOWS_CARGO_CACHE_KEY_PREFIX }}:" \
              "${{ env.LINUX_CARGO_CACHE_KEY_PREFIX }}:" \
              "${{ env.LINUX_BUILDER_IMAGE_CACHE_KEY_PREFIX }}:"; do
            echo "Checking caches with prefix: $KEY_PREFIX"
            gh cache list \
              --repo "$GITHUB_REPOSITORY" \
              --key "$KEY_PREFIX" \
              --limit 100 \
              --json id,key,createdAt \
            | jq -r --argjson cutoff "$SEVEN_DAYS_AGO" \
                '[.[] | select((.createdAt | sub("\\.[0-9]+Z$"; "Z") | fromdateiso8601) < $cutoff)] | .[].id' \
            | while read -r id; do
                echo "  Deleting stale cache id=$id"
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done
          done

  # ===========================================================================
  # Job 2 · build-linux
  # ===========================================================================
  build-linux:
    name: Lint, Test & Build (Linux)
    runs-on: ubuntu-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Derive binary name from Cargo.toml
        run: echo "BIN_NAME=$(./build.sh --bin-name)" >> "$GITHUB_ENV"

      # == Cargo cache container volume =======================================
      - name: Restore cargo cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/containers/storage/volumes/${{ env.CARGO_VOLUME_NAME }}
          key: ${{ env.LINUX_CARGO_CACHE_KEY_PREFIX }}:${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # == Container image cache: Linux builder ===============================
      - name: Restore Linux builder image from cache
        id: linux-builder-image-cache
        uses: actions/cache@v5
        with:
          path: /tmp/${{ env.LINUX_BUILDER_IMAGE }}.tar
          key: ${{ env.LINUX_BUILDER_IMAGE_CACHE_KEY_PREFIX }}:${{ hashFiles('Containerfile.linux_builder') }}

      - name: Load cached Linux builder image into Podman
        if: steps.linux-builder-image-cache.outputs.cache-hit == 'true'
        run: podman load --input /tmp/${{ env.LINUX_BUILDER_IMAGE }}.tar

      - name: Setup Linux builder image
        if: steps.linux-builder-image-cache.outputs.cache-hit != 'true'
        run: ./build.sh --setup-linux-image

      - name: Save Linux builder image to cache
        if: steps.linux-builder-image-cache.outputs.cache-hit != 'true'
        run: podman save --output /tmp/${{ env.LINUX_BUILDER_IMAGE }}.tar ${{ env.LINUX_BUILDER_IMAGE }}

      # == Lint ===============================================================
      - name: Run linter
        continue-on-error: true
        run: ./build.sh --lint

      # == Test ===============================================================
      - name: Run tests
        run: ./build.sh --test

      # == Build Linux binary =================================================
      - name: Build Linux binary
        run: ./build.sh --linux

      # == Upload Linux binary ================================================
      - name: Upload Linux binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-binary
          path: dist/${{ env.BIN_NAME }}
          archive: false
          if-no-files-found: error

  # ===========================================================================
  # Job 3 · build-windows
  # ===========================================================================
  build-windows:
    name: Lint, Test & Build (Windows)
    runs-on: windows-latest
    needs: prepare

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Derive binary name from Cargo.toml
        shell: bash
        run: echo "BIN_NAME=$(bash build.sh --bin-name)" >> "$GITHUB_ENV"

      - name: Set cargo env vars
        run: |
          echo "CARGO_HOME=$HOME\.cargo" >> $env:GITHUB_ENV
          echo "CARGO_TARGET_DIR=$HOME\.cargo\target" >> $env:GITHUB_ENV

      # == Windows Cargo Cache ================================================
      - name: Restore cargo cache
        uses: actions/cache@v5
        with:
          path: ${{ env.CARGO_HOME }}
          key: ${{ env.WINDOWS_CARGO_CACHE_KEY_PREFIX }}:${{ hashFiles('Cargo.toml', 'Cargo.lock') }}

      # == Lint ===============================================================
      - name: Run linter
        continue-on-error: true
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings

      # == Test ===============================================================
      - name: Run tests
        run: cargo test

      # == Build Windows binary ===============================================
      - name: Build Windows binary
        run: |
          cargo fmt
          cargo clippy --all-targets
          cargo build --release

      # == Upload Windows binary ==============================================
      - name: Upload Windows binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-binary
          path: ${{ env.CARGO_TARGET_DIR }}/release/${{ env.BIN_NAME }}.exe
          archive: false
          if-no-files-found: error

  # ===========================================================================
  # Job 4 · release
  # ===========================================================================
  release:
    name: Tag & Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Make build script executable
        run: chmod +x ./build.sh

      - name: Derive binary name from Cargo.toml
        run: echo "BIN_NAME=$(./build.sh --bin-name)" >> "$GITHUB_ENV"

      - name: Download all the uploaded artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      # == Force-push the 'continuous' tag to current HEAD ====================
      - name: Move 'continuous' tag to HEAD
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f continuous
          git push -f origin refs/tags/continuous

      # == Create or update the rolling 'continuous' release ==================
      - name: Update rolling 'continuous' release
        run: |
          TAG="continuous"
          TITLE="Continuous Release"

          LINUX_BINARY_CHECKSUM=$(sha256sum "dist/${BIN_NAME}" | cut -d' ' -f1)
          WINDOWS_BINARY_CHECKSUM=$(sha256sum "dist/${BIN_NAME}.exe" | cut -d' ' -f1)

          NOTES="Continuous release - built from commit ${SHORT_SHA::7} on $(date -u '+%Y-%m-%d %H:%M UTC')

          **Binaries:**

          | Platform       | File                | SHA256 Checksum              |
          |----------------|---------------------|------------------------------|
          | Linux x86_64   | \`${BIN_NAME}\`     | \`$LINUX_BINARY_CHECKSUM\`   |
          | Windows x86_64 | \`${BIN_NAME}.exe\` | \`$WINDOWS_BINARY_CHECKSUM\` |"

          # Delete existing release (ignore errors if it doesn't exist yet)
          gh release delete "$TAG" -y --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          # Create fresh release
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --notes "$NOTES"

          # Upload artifacts
          gh release upload "$TAG" \
            "dist/${BIN_NAME}" \
            "dist/${BIN_NAME}.exe" \
            --repo "$GITHUB_REPOSITORY"
